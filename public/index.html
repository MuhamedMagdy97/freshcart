<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/empty-cart.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0aad0a" />
    <meta name="description" content="FreshCart — simple online grocery shopping." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      (function (location) {
        var params = new URLSearchParams(location.search);
        var route = params.get("p");
        if (route) {
          var query = params.get("q");
          window.history.replaceState(null, "", route + (query ? "?" + query : "") + location.hash);
        }
      })(window.location);
    </script>
    <title>FreshCart</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run FreshCart.</noscript>
    <div id="root"></div>
  </body>
</html>
